packages:
  - playground

allowBuilds:
  esbuild: true
  simple-git-hooks: true

overrides:
  oxc-walker: link:.
  vite: "catalog:"

registries:
  https://registry-bridge.viteplus.dev/:
    scopes: ["@voidzero-dev"]
    prefix: vite-plus-preview

verifyDepsBeforeRun: install
trustPolicy: no-downgrade
trustPolicyExclude:
  - vite-plus@1.0.0-rc.0
  - "@voidzero-dev/vite-plus-*"
# oxc packages are published by the oxc project itself, so they are exempt from
# pnpm 11's default `minimumReleaseAge` (1 day) supply-chain gate. Without this,
# renovate bumps to a freshly released oxc-parser fail `vp install` in CI until
# the packages are 24h old.
minimumReleaseAgeExclude:
  - oxc-parser
  - "@oxc-parser/*"
  - "@oxc-project/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxfmt
  - "@oxfmt/*"
  - oxlint
  - "@oxlint/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: vite-plus-preview:1.0.0-rc.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
